# Toolchain for VideoSync. Versions are pinned deliberately, not `latest` —
# this repo is a reference for future sessions and floating versions make
# research citations and reproductions drift.

[tools]
go = "1.27.0"
node = "26.8.1"

[env]
# Keep module/package caches inside the project so a sandbox reset is clean
# and so disk usage is visible in one place (the host FS runs tight on space).
GOPATH = "{{config_root}}/.cache/go"
GOMODCACHE = "{{config_root}}/.cache/go/pkg/mod"
GOBIN = "{{config_root}}/.cache/go/bin"

[tasks.server]
description = "Run the sync server"
dir = "{{config_root}}/server"
run = "go run ./cmd/videosyncd"

[tasks.sim]
description = "Run the Risk-A simulation harness (no browser)"
dir = "{{config_root}}/server"
run = "go run ./cmd/simharness"

[tasks.test]
description = "Run all tests (Go + TS client core + the harness's media server + the generated manifests) and typecheck both shims"
run = [
  "cd {{config_root}}/server && go test ./...",
  "cd {{config_root}}/client/core && npm test",
  # No browser and no container: it only starts local-media.mjs on a free port.
  "cd {{config_root}}/harness/browser && node --test local-media.test.mjs",
  "cd {{config_root}}/client/userscript && npx tsc --noEmit",
  "cd {{config_root}}/client/extension && npx tsc --noEmit",
  # The generated manifests and @match lines, from providers/*.json. No browser.
  "cd {{config_root}}/client/extension && node --test manifest.test.mjs",
  "cd {{config_root}}/client/userscript && node --test meta.test.mjs",
]

[tasks.test-e2e]
description = "Run the TS client against a real videosyncd (builds the binary)"
dir = "{{config_root}}/client/core"
run = "npm run test:e2e"

[tasks.probe]
description = "Run the Risk-B browser probes in the pinned container"
dir = "{{config_root}}/harness/browser"
run = "./run.sh node probe-detector.mjs"

[tasks.build]
description = "Build both shipping shims"
run = [
  "cd {{config_root}}/client/userscript && npm run build",
  "cd {{config_root}}/client/extension && npm run build",
]

[tasks.build-core]
description = "Bundle the client core for the browser harness"
dir = "{{config_root}}/client/core"
run = "npm run build:probe"

[tasks.probe-stack]
description = "Stage the artifacts the full-stack browser probes need, then run them"
run = [
  "cd {{config_root}}/server && go build -o ../harness/browser/dist/videosyncd ./cmd/videosyncd",
  "cd {{config_root}}/client/userscript && npm run build",
  "cd {{config_root}}/client/extension && npm run build",
  "cp {{config_root}}/client/userscript/dist/videosync.user.js {{config_root}}/harness/browser/dist/",
  "cd {{config_root}}/harness/browser && ./run.sh node probe-userscript.mjs",
  "cd {{config_root}}/harness/browser && ./run.sh node probe-extension.mjs",
]
